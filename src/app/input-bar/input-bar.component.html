<div class="buttons-container">
    <div class="control-group">
        <button mat-icon-button class="help-button" (click)="openGeeksForGeeks()" matTooltip="Learn more about this algorithm" matTooltipShowDelay="250" matTooltipPosition="above" aria-label="Learn more about this algorithm">
            <mat-icon>help_outline</mat-icon>
        </button>
        <select class="algo-select" [(ngModel)]="sortService.selectedAlgo" (change)="onAlgoSelectChange()" [disabled]="sortService.inProgress" aria-label="Sorting algorithm">
            <option *ngFor="let algo of algorithms" [value]="algo.id">{{algo.name}}</option>
        </select>
        <label class="bar-count">
            <span>Bars</span>
            <input type="number" class="bar-count-input" [(ngModel)]="sortService.numBars" (change)="onBarCountChange()" min="2" [max]="maxBars">
        </label>
    </div>
    <div class="control-group">
        <button mat-flat-button (click)="sort()" [disabled]="sortService.inProgress" class="main-button sort-button">Sort</button>
        <button mat-flat-button (click)="reset()" [disabled]="sortService.inProgress" class="main-button reset-button">Reset</button>
        <button mat-flat-button (click)="stop()" [disabled]="!sortService.inProgress" class="main-button stop-button">Stop</button>
    </div>
    <div class="slider-container">
        <span class="slider-label">Delay <strong>{{sortService.delay}} ms</strong></span>
        <mat-slider [(ngModel)]="sortService.delay" min="0" max="200" step="1" aria-label="Delay between steps"></mat-slider>
    </div>
</div>
